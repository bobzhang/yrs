name: Compatibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONBIT_INSTALL_VERSION: 0.10.15+943464bfa
  RUST_REFERENCE: ac339600c712642e556895426113c3f9c117de39

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon build --target all --release
      - run: moon test --target all
      - name: Verify generated public interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  interoperability:
    # Reference crash fixtures and process RSS measurements are currently
    # characterized on macOS. Unit tests above also cover Linux.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, contracts, wire, lifecycle, undo, undo-persistence, undo-yjs, undo-yjs-native, undo-high-clocks]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check out the unchanged pinned Rust reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: y-crdt/y-crdt
          ref: ${{ env.RUST_REFERENCE }}
          path: .repos/y-crdt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install pinned toolchains and Yjs
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.97.1 --profile minimal
          npm ci --ignore-scripts --prefix validation/yjs
      - name: Run interoperability checks
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            core)
              python3 validation/compare.py
              ;;
            contracts)
              python3 validation/contracts.py
              python3 validation/handles.py
              python3 validation/streams.py
              python3 validation/update_codecs.py
              python3 validation/type_refs.py
              python3 validation/block_ranges.py
              python3 validation/v2_clock_boundaries.py
              python3 validation/large_ranges.py
              python3 validation/codec_updates.py
              python3 validation/value_decode.py
              python3 validation/value_encode.py
              python3 validation/any_stream.py
              python3 validation/embeds.py
              python3 validation/prelims.py
              python3 validation/protocol_codec.py
              ;;
            wire)
              python3 validation/sparse_wire.py
              python3 validation/pending.py
              python3 validation/pending_scheduling.py
              ;;
            undo)
              python3 validation/undo_mixed.py
              ;;
            undo-yjs)
              python3 validation/undo_mixed.py --reference yjs
              ;;
            undo-high-clocks)
              python3 validation/undo_high_clocks.py
              ;;
            undo-yjs-native)
              python3 validation/undo_mixed.py --reference yjs --target native
              ;;
            undo-persistence)
              python3 validation/undo_gc.py
              python3 validation/undo_mixed.py --gc on --owner moon --report validation/undo-gc-port-results.json
              python3 validation/undo_persistence.py
              ;;
            lifecycle)
              python3 validation/transactions.py
              python3 validation/presence.py
              python3 validation/traces.py --traces friendsforever_flat --target native
              ;;
          esac
      - name: Preserve reports and any failing fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interoperability-${{ matrix.suite }}
          path: |
            validation/*results.json
            validation/fixtures/
            /tmp/yrs-undo-mixed-*.json
